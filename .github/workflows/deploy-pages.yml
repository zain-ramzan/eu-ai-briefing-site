name: Publish the public EU AI Briefing page

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Read the public website files
        uses: actions/checkout@v4
      - name: Set up the package helper
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install website packages
        run: pnpm install --frozen-lockfile
      - name: Build the public page for its own address
        run: pnpm exec vite build --base=/eu-ai-briefing-site/
      - name: Prepare the public site address
        uses: actions/configure-pages@v5
      - name: Upload only the finished public page
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist/public"

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish the public page
        id: deployment
        uses: actions/deploy-pages@v4
